  <style id="app-styles">
:root {
  color-scheme: light;
  --ink: #2f2a24;

  --green: #2f7356;

  --purple: #5d3a9b;

  --blue: #49a9cb;

}

* { box-sizing: border-box; }

/* Title screen */
.start-screen { position: relative; min-height: 100svh; display: grid; place-items: center; overflow: hidden; padding: 28px 18px 42px; background: linear-gradient(#b9e7f3 0 46%, #7fbf77 46% 62%, #49784f 62%); }

.start-card { position: relative; z-index: 2; width: min(740px, 100%); padding: clamp(22px, 5vw, 46px); text-align: center; border: 3px solid #6f4c2d; border-radius: 10px; background: linear-gradient(90deg, rgba(143,93,46,.14) 1px, transparent 1px) 0 0/28px 100%, linear-gradient(#f9e2a8, #edc777); box-shadow: 0 8px 0 #4c3829, 0 18px 50px rgba(22,42,26,.35), inset 0 0 0 7px rgba(255,249,218,.55); }

.start-card::before { left: 18px; }

.logo-kicker { display: inline-flex; gap: 8px; align-items: center; margin: 0 0 12px; padding: 7px 14px; border-radius: 999px; color: #fff8dc; background: #2f7356; font-size: .78rem; font-weight: 900; letter-spacing: .12em; box-shadow: 0 4px 0 #1e503e; }
.game-title { margin: 0 auto; max-width: 680px; color: #3a2d22; font-family: var(--game-font); font-weight: 1000; line-height: 1.08; text-wrap: balance; text-shadow: 0 3px 0 #fff0bb, 0 5px 0 rgba(88,62,35,.12); }

/* App shell */
.app-shell { min-height: 100vh; padding-bottom: 88px; background: radial-gradient(circle at 15px 15px, rgba(112,92,54,.06) 2px, transparent 2px) 0 0/30px 30px, var(--cream); }

.storage-alert { position: sticky; z-index: 49; top: 64px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px 16px; border-bottom: 2px solid #b65148; color: #662b27; background: #fff0ed; box-shadow: 0 4px 12px rgba(78,38,34,.15); font-size: .78rem; }

.mini-brand { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; cursor: pointer; text-align: left; }

.header-stats { display: flex; align-items: center; gap: 7px; }
.header-pill { display: grid; min-width: 64px; min-height: 44px; place-content: center; padding: 5px 10px; border: 1px solid var(--line); border-radius: 12px; background: white; text-align: center; }
.header-pill strong { color: var(--green); font-size: .9rem; }
.header-pill small { color: var(--muted); font-size: .63rem; }
.main-content { width: min(1180px, 100%); min-height: calc(100vh - 140px); margin: auto; padding: clamp(18px, 4vw, 38px) clamp(14px, 3.5vw, 32px) 42px; outline: 0; }
.view { animation: page-in .28s ease both; }
@keyframes page-in { from { opacity: 0; transform: translateY(8px); } }
.paper-card { border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, #fffdf7, var(--paper)); box-shadow: var(--shadow); }
.eyebrow { margin: 0 0 5px; color: var(--green); font-size: .7rem; font-weight: 950; letter-spacing: .15em; text-transform: uppercase; }
h1, h2, h3, p { overflow-wrap: anywhere; }
h1 { margin: 0; font-family: var(--game-font); font-size: clamp(1.75rem, 5vw, 2.7rem); font-weight: 950; line-height: 1.18; letter-spacing: .01em; }
h2 { margin: 0; font-size: 1.15rem; }
p { line-height: 1.65; }
.muted { color: var(--muted); }

.day-hero { position: relative; display: grid; gap: 22px; padding: clamp(20px, 5vw, 36px); overflow: hidden; }
.day-hero::after { content: "✦"; position: absolute; right: -18px; bottom: -42px; color: rgba(230,173,55,.13); font-size: 150px; transform: rotate(14deg); }

.day-control { position: relative; z-index: 1; display: grid; grid-template-columns: 54px minmax(100px, 1fr) 54px; align-items: center; gap: 8px; min-width: 0; padding: 8px; border: 2px solid #d5bd86; border-radius: 16px; background: #fff6d9; }
.day-control button { width: 54px; height: 54px; border: 0; border-radius: 13px; color: white; background: var(--green); box-shadow: 0 4px 0 var(--green-dark); font-size: 1.8rem; font-weight: 900; cursor: pointer; }

.day-control span { color: var(--muted); font-size: .72rem; font-weight: 800; white-space: nowrap; }
.day-panel { display: grid; gap: 9px; min-width: 0; }
.day-progress { height: 9px; overflow: hidden; border: 1px solid #d5bd86; border-radius: 999px; background: #e8dcc1; }
.day-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green), #86bd70, var(--gold)); transition: width .22s ease; }
.dashboard-grid { display: grid; gap: 15px; margin: 16px 0 30px; }

.progress-ring { flex: 0 0 108px; display: grid; place-items: center; width: 108px; height: 108px; border-radius: 50%; background: conic-gradient(var(--green) var(--progress), #e7ddc5 0); box-shadow: inset 0 0 0 1px #d5c59f; }

.family-card { align-items: stretch; flex-direction: column; }

.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 30px 2px 12px; }

.quest-card:hover { border-color: #bca46e; transform: translateY(-1px); }

.is-done .quest-check { border-color: var(--green); background: var(--green); box-shadow: 0 3px 0 var(--green-dark); }
.quest-main { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 6px 10px; min-width: 0; padding: 9px 4px; text-align: left; }
.quest-icon { grid-row: 1 / span 2; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--paper-deep); font-size: 24px; }
.quest-copy { min-width: 0; display: grid; gap: 6px; }
.quest-title { font-weight: 900; line-height: 1.35; }

.quest-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

.safety-low { color: #276145; background: #dff0df; }

.card-side-actions { display: grid; align-content: center; justify-items: center; gap: 1px; }

.goal-star { color: #c8bfa8; }

.hint-button { min-width: 68px; min-height: 46px; padding: 6px 8px; border: 1px solid #d8be78; border-radius: 11px; color: #72520d; background: #fff4c9; font-size: .7rem; font-weight: 900; cursor: pointer; }
.hint-button span { display: inline-block; margin-right: 2px; }
.card-players { grid-column: 2; display: flex; margin: 0; padding-left: 5px; }
.mini-player { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-left: -5px; border: 2px solid #fff; border-radius: 50%; background: color-mix(in srgb, var(--player) 20%, #fff); font-size: 15px; }

/* Pages and filters */
.page-title { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 4px 2px 22px; }

.empty-state { display: grid; justify-items: center; gap: 8px; padding: 50px 20px; border: 2px dashed #ccb98e; border-radius: 18px; color: var(--muted); background: rgba(255,250,240,.58); text-align: center; }

/* Memories */

.button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

.primary-button { border: 0; color: white; background: var(--green); box-shadow: 0 4px 0 var(--green-dark); }

.setting-player { display: grid; grid-template-columns: 48px 1fr 24px; align-items: center; gap: 10px; min-height: 58px; border-top: 1px solid #e4d8bd; }
.setting-player span { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; background: color-mix(in srgb, var(--player) 18%, #fff); font-size: 24px; }
.setting-player i { width: 20px; height: 20px; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 0 1px #ab9d7f; }

  <script id="inline-config">
const CONFIG = Object.freeze({

  <script id="app-script">
(function () {
  'use strict';

  const APP_ID = 'honosou-papa-minecraft-tracker';
  const STORAGE_KEY = `${APP_ID}:state:v1`;
  const RECOVERY_KEY_PREFIX = `${APP_ID}:recovery:`;
  const SAFETY = Object.freeze({ A: 'あんしん', B: 'じゅんびして冒険', C: 'しっかりそなえて挑戦' });
  const PHASE = Object.freeze({
    1: 'はじめの一歩',
    2: '暮らしを豊かに',
    3: '世界を広げる',
    4: 'こだわりの村づくり',
    5: '100日の集大成'
  });
  const PLAYERS = Object.freeze([
    { id: 'hono', name: 'ほのちゃん', color: '#7d4bc6', icon: '👧' },
    { id: 'sou', name: 'そうくん', color: '#26232b', icon: '👦' },
    { id: 'papa', name: 'パパ', color: '#49a9cb', icon: '👨‍🏫' }
  ]);

  function emojiFor(title, category) {
    const rules = [
      [/赤ちゃん|卵/, '🐣'], [/牛|牛乳/, '🐄'], [/ヒツジ|羊毛/, '🐑'], [/ブタ/, '🐷'], [/ニワトリ/, '🐔'],
      [/ウマ|馬/, '🐴'], [/ロバ|ラバ/, '🫏'], [/ネコ/, '🐈'], [/オオカミ/, '🐺'], [/カメ/, '🐢'],
      [/ウーパールーパー/, '🫧'], [/ミツバチ|ハチミツ|ハニカム/, '🐝'], [/ヤギ/, '🐐'], [/キツネ/, '🦊'], [/ラクダ/, '🐪'], [/パンダ/, '🐼'],
      [/花|タンポポ|染料/, '🌷'], [/木|原木|苗木|板材|森林|タイガ|サクラ/, '🌳'], [/畑|小麦|ニンジン|ジャガイモ|カボチャ|スイカ|サトウキビ|カカオ/, '🌱'],
      [/魚|釣り|水槽/, '🐟'], [/海|海岸|船|ボート|川|池|水|氷/, '🌊'], [/村|取引/, '🏘️'], [/砂漠|砂|荒野/, '🏜️'], [/雪|イグルー/, '❄️'],
      [/洞窟|鍾乳|石|丸石|方解石|鉱|鉄|銅|金|ダイヤ|アメジスト|硫黄|辰砂/, '🪨'], [/地図|製図|座標|コンパス/, '🗺️'],
      [/ベッド|寝室/, '🛏️'], [/盾|防具|手すり|柵|壁/, '🛡️'], [/松明|ランタン|ろうそく|明る|街灯/, '🏮'],
      [/旗/, '🚩'], [/ガラス|窓/, '🪟'], [/本|書見台|読書/, '📚'], [/料理|パン|ケーキ|パイ|シチュー|クッキー|食料|かまど|燻製器/, '🍞'],
      [/チェスト|樽|収納/, '📦'], [/作業台|台|金床|砥石|大釜|ホッパー|ピストン|レール|トロッコ|自動/, '🛠️'],
      [/家|拠点|屋根|建物|温室|ベランダ|橋|噴水|記念/, '🏠'], [/部屋|カーペット|飾|花壇|小道|入口/, '🎨'],
      [/宝|エメラルド|ダイヤ/, '💎'], [/キノコ/, '🍄'], [/沼地|マングローブ/, '🌿'], [/望遠鏡/, '🔭'], [/時計/, '🕰️']
    ];
    const match = rules.find(([pattern]) => pattern.test(title));
    return match ? match[1] : ({ つくる: '🔨', あつめる: '🎒', みつける: '🧭', そだてる: '🌱', かざる: '🎨', まもる: '🛡️' }[category] || '⭐');
  }

  function unlocksFor(title, category) {
    const rules = [
      [/作業台/, 'ほとんどの道具や設備をクラフトできるようになるよ。'],
      [/かまど|溶鉱炉|燻製器|自動かまど/, '素材や食べ物を焼いて、使えるアイテムを増やせるよ。'],
      [/機織り機|旗/, '色や模様を組み合わせて、家族だけの目印を作れるよ。'],
      [/石切台|階段|ハーフブロック/, '建築ブロックの形を増やして、屋根や壁を工夫できるよ。'],
      [/地図|コンパス|座標/, '見つけた場所を記録し、次の探索へつなげられるよ。'],
      [/畑|小麦|ニンジン|ジャガイモ|カボチャ|スイカ/, '食材を拠点で増やし、料理や動物のお世話に使えるよ。'],
      [/赤ちゃん|仲良く|名前/, '動物との暮らしが広がり、牧場の楽しみが増えるよ。'],
      [/花|染料|羊毛|ガラス|カーペット/, '色を使った旗、内装、庭づくりへ進めるよ。'],
      [/村|取引/, '村人との取引で、地上でも新しい道具や素材を集められるよ。'],

      [/海|川|魚|釣り|船|ボート|水槽/, '水辺の移動、料理、飾りづくりを楽しめるよ。'],
      [/家|拠点|部屋|屋根|橋|温室|ベランダ|花壇|小道/, '拠点をもっと便利で自分たちらしい場所に広げられるよ。'],

    ];
    const match = rules.find(([pattern]) => pattern.test(title));
    if (match) return match[1];
    return {
      つくる: '新しいクラフトや建築へ進むための道具が増えるよ。',
      あつめる: '集めた素材をクラフト、料理、飾りに活用できるよ。',
      みつける: '世界の特徴が分かり、次に探したい場所が増えるよ。',

      かざる: '家族のワールドを、もっと好きな見た目にできるよ。',
      まもる: 'ハードコアで長く暮らすための基本が身につくよ。'

  }

  function preparationFor(title, safety) {
    if (safety !== SAFETY.C) return [];
    if (/硫黄洞窟|硫黄ブロック|辰砂/.test(title)) return [
      '吐き気効果に備え、長居せず戻る時間を決める。',
      '硫黄のトゲなどの落下物に備えて、頭上も確認する。',
      '地下Mobに備えて、盾、防具、食料、松明をそろえる。'
    ];
    if (/海底|水中|沈没船/.test(title)) return ['水中呼吸の残りを確認する。', '岸かボートへすぐ戻れる距離で探す。'];
    if (/洞窟|鉱|ダイヤ|レッドストーン/.test(title)) return ['盾、防具、食料、松明をそろえる。', '真下掘りをせず、落下と地下Mobに注意する。'];
    if (/ポータル|寺院/.test(title)) return ['感圧板や溶岩へ近づかず、外側から確認する。', '盾、防具、食料をそろえる。'];
    return ['盾、防具、食料、明かりを確認し、危なくなったら早めに戻る。'];
  }

  function tagsFor(title, category) {
    const tags = [category];
    if (/赤ちゃん|牛|ヒツジ|ブタ|ニワトリ|ウマ|ロバ|ネコ|オオカミ|カメ|ミツバチ|ヤギ|キツネ|ラクダ|パンダ/.test(title)) tags.push('動物');
    if (/花|染料|羊毛|色|旗|ガラス/.test(title)) tags.push('色');
    if (/家|拠点|部屋|屋根|橋|花壇|庭|建物/.test(title)) tags.push('建築');
    if (/洞窟|村|バイオーム|海|森|島|寺院|遺跡/.test(title)) tags.push('探索');
    return [...new Set(tags)];
  }

  function rows(prefix, category, _icon, text) {
    return text.trim().split('\n').map((line, index) => {

      oscillator.frequency.setValueAtTime(kind === 'complete' ? 523 : 392, context.currentTime);

  }

  function updateProgressUI() {
    renderHeader();
    const stats = getStats(state);
    const ring = $('[data-overall-ring]');
    if (ring) ring.style.setProperty('--progress', `${stats.percent * 3.6}deg`);
    const percent = $('[data-overall-percent]');
    const count = $('[data-overall-count]');
    const message = $('[data-overall-message]');
    if (percent) percent.textContent = `${stats.percent}%`;
    if (count) count.textContent = `${stats.done}/${stats.total}達成`;
    if (message) message.textContent = stats.done < 20 ? '最初の一歩を楽しもう！' : stats.done < 100 ? 'ワールドがどんどん豊かになっているよ。' : stats.done < 200 ? '家族のマスターまであと少し！' : '200個すべて達成！すごい！';
    $$('[data-category-summary]').forEach((tile) => {
      const category = tile.dataset.categorySummary;
      const items = CATALOG.filter((item) => item.category === category);
      const done = items.filter((item) => state.progress[item.id]?.completed === true).length;
      const value = Math.round(done / items.length * 100);
      const small = $('small', tile);
      const bar = $('.bar span', tile);
      const label = $('.bar-wrap b', tile);
      if (small) small.textContent = `${done}/${items.length}`;
      if (bar) bar.style.width = `${value}%`;
      if (label) label.textContent = `${value}%`;
      $('.bar-wrap', tile)?.setAttribute('aria-label', `${category} ${value}%`);
    });
    const recommendations = $('[data-recommended-list]');
    if (recommendations) recommendations.innerHTML = recommended().map((item) => activityCard(item, true)).join('') || '<div class="empty-state">🎉 おすすめを全部達成したよ！</div>';
    const recentSection = $('[data-recent-section]');
    if (recentSection) recentSection.innerHTML = recentMarkup();
  }

  function updateActivityUI(id, restoreAction) {
    const item = CATALOG.find((candidate) => candidate.id === id);
    if (!item) return;
    const cards = $$(`.quest-card[data-id="${id}"]`);
    cards.forEach((card) => {
      if (card.closest('.board-list') && !filterActivities([item], state, ui).length) {
        card.remove();
        return;
      }
      const template = document.createElement('template');
      template.innerHTML = activityCard(item, card.classList.contains('compact')).trim();
      card.replaceWith(template.content.firstElementChild);
    });
    updateProgressUI();
    const resultCount = $('[data-result-count]');
    if (resultCount && ui.view === 'board') resultCount.textContent = String(filterActivities(CATALOG, state, ui).length);
    const boardList = $('.board-list');
    if (boardList && !boardList.querySelector('.quest-card') && !filterActivities(CATALOG, state, ui).length) {
      boardList.innerHTML = '<div class="empty-state"><span>🔎</span><b>見つからなかったよ</b><p>検索する言葉や絞り込みを変えてみよう。</p><button data-action="clear-filter" class="primary-button small">条件をもどす</button></div>';
    }
    if (restoreAction) {
      const restored = $(`.quest-card[data-id="${id}"] [data-action="${restoreAction}"]`);
      const fallback = ui.view === 'board' ? $('#board-title') : $('[data-recommended-heading]');
      (restored || fallback)?.focus({ preventScroll: true });
    }
  }

  function recommended() {
    const safe = CATALOG.filter((item) => state.progress[item.id]?.completed !== true && item.safety !== SAFETY.C && !state.goals.includes(item.id));
    const goals = state.goals.map((id) => CATALOG.find((item) => item.id === id)).filter(Boolean).filter((item) => state.progress[item.id]?.completed !== true);
    const mixed = [...goals, ...safe];
    const seenCategories = new Set();
    const picked = [];
    for (const item of mixed) {
      if (picked.length >= 3) break;
      if (!seenCategories.has(item.category) || picked.length > 1) {
        picked.push(item);
        seenCategories.add(item.category);
      }
    }
    return picked;
  }

  function recentMarkup() {
    const recent = Object.entries(state.progress)
      .filter(([, record]) => record.completed === true)
      .sort((a, b) => String(b[1].completedAt).localeCompare(String(a[1].completedAt)))
      .slice(0, 3)
      .map(([id]) => CATALOG.find((item) => item.id === id))
      .filter(Boolean);
    return recent.length ? `<div class="section-heading"><div><p class="eyebrow">MEMORIES</p><h2>最近のできた！</h2></div></div><div class="quest-stack">${recent.map((item) => activityCard(item, true)).join('')}</div>` : '';
  }

  function renderHome() {
    const stats = getStats(state);

        <div class="day-panel"><div class="day-control" aria-label="ゲーム内日数"><button data-action="day-minus" aria-label="1日戻す">−</button><div><strong data-day-number>${state.currentDay}</strong><span>日目 / 100日</span></div><button data-action="day-plus" aria-label="1日進める">＋</button></div><div class="day-progress" role="progressbar" aria-label="100日までの進み具合" aria-valuemin="1" aria-valuemax="100" aria-valuenow="${state.currentDay}"><span data-day-progress style="width:${state.currentDay}%"></span></div></div>
      </div>

        <article class="paper-card family-card"><h2>3人のチーム</h2><div class="family-row">${PLAYERS.map((player) => `<div class="family-member" style="--player:${player.color}"><span>${player.icon}</span><b>${player.name}</b></div>`).join('')}</div><p>競争ではなく、3人でひとつのワールドを育てます。</p></article>
      </div>
      <div class="section-heading"><div><p class="eyebrow">NEXT QUEST</p><h2 data-recommended-heading tabindex="-1">次におすすめ</h2></div><button data-view="board" class="text-button">全部見る →</button></div>
      <div class="quest-stack" data-recommended-list>${recommended().map((item) => activityCard(item, true)).join('') || '<div class="empty-state">🎉 おすすめを全部達成したよ！</div>'}</div>
      <div class="section-heading"><div><p class="eyebrow">ADVENTURE MAP</p><h2>6つの冒険エリア</h2></div></div>
      <div class="category-grid">${categoryStats}</div>
      <div data-recent-section>${recentMarkup()}</div>
    </section>`;
  }

  function renderBoard() {
    const items = filterActivities(CATALOG, state, ui);
    const categoryOptions = ['all', 'つくる', 'あつめる', 'みつける', 'そだてる', 'かざる', 'まもる'];
    return `<section class="view" aria-labelledby="board-title">
      <div class="page-title"><div><p class="eyebrow">200 ADVENTURES</p><h1 id="board-title" tabindex="-1">進捗ボード</h1><p>つくる、あつめる、みつける。気になる冒険を選ぼう。</p></div><div class="result-count"><strong data-result-count>${items.length}</strong><span>件</span></div></div>
      <div class="filter-panel paper-card">
        <label class="search-box"><span>⌕</span><input id="quest-search" type="search" value="${escapeHtml(ui.query)}" placeholder="例：花、赤ちゃん、ガラス" aria-label="進捗を検索"></label>
        <div class="chip-scroll" aria-label="カテゴリ">${categoryOptions.map((category) => `<button class="filter-chip ${ui.category === category ? 'active' : ''}" data-filter-category="${category}" aria-pressed="${ui.category === category}">${category === 'all' ? 'すべて' : category}</button>`).join('')}</div>

      <div class="quest-stack goals-stack">${goals.map((item) => activityCard(item)).join('') || '<div class="empty-state"><span>⭐</span><b>今日の目標はまだないよ</b><p>進捗ボードから、気になるものを選ぼう。</p><button data-view="board" class="primary-button small">進捗ボードへ</button></div>'}</div></section>`;
  }

  function renderMemories() {
    const records = Object.entries(state.progress).filter(([, record]) => record.completed === true).sort((a, b) => String(b[1].completedAt).localeCompare(String(a[1].completedAt)));
    return `<section class="view" aria-labelledby="memory-title"><div class="page-title"><div><p class="eyebrow">OUR MEMORIES</p><h1 id="memory-title">思い出アルバム</h1><p>3人で増やした「できた！」を振り返ろう。</p></div><div class="result-count"><strong>${records.length}</strong><span>個</span></div></div>
      <div class="timeline">${records.map(([id, record]) => {
        const item = CATALOG.find((candidate) => candidate.id === id);
        if (!item) return '';
        return `<article class="memory-card" data-id="${id}"><div class="memory-day"><strong>DAY ${record.day}</strong><span>${new Date(record.completedAt).toLocaleDateString('ja-JP')}</span></div><div class="memory-icon">${item.emoji}</div><div class="memory-copy"><h2>${escapeHtml(item.title)}</h2><div>${playerBadges(record.players)}</div>${record.note ? `<p>「${escapeHtml(record.note)}」</p>` : '<p class="muted">メモはまだありません</p>'}</div><button data-action="hint" data-id="${id}" aria-label="ヒントと記録を開く">💡</button></article>`;
      }).join('') || '<div class="empty-state"><span>📖</span><b>最初の思い出をつくろう</b><p>進捗を達成すると、ここに記録されます。</p></div>'}</div></section>`;
  }

  function renderSettings() {
    return `<section class="view" aria-labelledby="settings-title"><div class="page-title"><div><p class="eyebrow">SETTINGS</p><h1 id="settings-title">設定とデータ</h1><p>この端末に記録を保存しています。</p></div></div>
      <div class="settings-grid">
        <article class="paper-card settings-card"><h2>あそびやすさ</h2>
          <label class="toggle-row"><span><b>効果音</b><small>できた！を音でお祝い</small></span><input type="checkbox" data-setting="sound" ${state.settings.sound ? 'checked' : ''}><i></i></label>
          <label class="toggle-row"><span><b>動きを少なくする</b><small>スタンプや粒の動きを止める</small></span><input type="checkbox" data-setting="reducedMotion" ${state.settings.reducedMotion ? 'checked' : ''}><i></i></label>
          <label class="toggle-row"><span><b>文字を大きくする</b><small>全体の文字を少し読みやすく</small></span><input type="checkbox" data-setting="largeText" ${state.settings.largeText ? 'checked' : ''}><i></i></label>
        </article>
        <article class="paper-card settings-card"><h2>バックアップ</h2><p>ブラウザのデータを消すと記録も消えます。ときどきファイルに保存してね。</p><div class="button-row"><button class="secondary-button" data-action="export">⇩ 保存する</button><button class="secondary-button" data-action="import">⇧ 復元する</button></div><input id="import-file" type="file" accept="application/json,.json" hidden><small id="save-status" class="save-label">${storageHealthy ? '● 保存済み' : '⚠ 保存できていません'}</small></article>
        <article class="paper-card settings-card family-settings"><h2>家族カラー</h2>${PLAYERS.map((player) => `<div class="setting-player"><span style="--player:${player.color}">${player.icon}</span><b>${player.name}</b><i style="background:${player.color}"></i></div>`).join('')}</article>
        <article class="paper-card settings-card danger-card"><h2>最初からやり直す</h2><p>達成、メモ、日数、今日の目標をすべて消します。</p><button class="danger-button" data-action="reset">${ui.resetArmed ? 'もう一度押すと初期化します' : 'データを初期化'}</button></article>
      </div><p class="safety-note">🛡️ 安全度は遊び方を考えるための目安です。絶対の安全を保証するものではありません。装備や周囲を確認し、無理をせず楽しんでください。</p><p class="disclaimer">このアプリはMinecraft公式またはMojang Studios公認のサービスではありません。</p></section>`;

  function renderView() {
    const main = $('#main-content');
    if (!main) return;
    const renderers = { home: renderHome, board: renderBoard, goals: renderGoals, memories: renderMemories, settings: renderSettings };
    main.innerHTML = (renderers[ui.view] || renderHome)();
    $$('.nav-button').forEach((button) => {
      const active = button.dataset.view === ui.view;
      button.classList.toggle('active', active);
      button.setAttribute('aria-current', active ? 'page' : 'false');
    });
    renderHeader();
  }

  function showApp() {
    const start = $('#start-screen');
    const shell = $('#app-shell');
    if (start) start.hidden = true;
    if (shell) shell.hidden = false;
    ui.view = 'home';
    renderView();
    renderStorageAlert();
    $('#main-content')?.focus({ preventScroll: true });
  }

  function showStart() {
    const start = $('#start-screen');
    const shell = $('#app-shell');
    if (shell) shell.hidden = true;
    if (start) start.hidden = false;
    const button = $('#start-button');
    if (button) button.innerHTML = state.started ? '<span>▶</span> つづきから' : '<span>★</span> 冒険をはじめる';
  }

  function quickComplete(id) {
    const item = CATALOG.find((candidate) => candidate.id === id);
    if (!item) return;
    const previous = state.progress[id];
    if (previous?.completed === true) {
      setState(uncompleteActivity(state, id));
      toast('「これから」に戻しました');
    } else {
      setState(completeActivity(
        state,
        id,
        previous?.players?.length ? previous.players : PLAYERS.map((player) => player.id),
        previous?.note || '',
        previous?.completedAt || new Date().toISOString()
      ));
      playTone('complete');
      toast(`できた！ ${item.title}`);
    }
    updateActivityUI(id, 'complete');
    if (state.progress[id]?.completed === true) celebrate(id);
  }

  function openDetail(id, opener) {
    const item = CATALOG.find((candidate) => candidate.id === id);
    if (!item) return;
    ui.detailId = id;
    ui.dialogOpener = opener || document.activeElement;
    const record = state.progress[id];
    const done = record?.completed === true;
    const dialog = $('#quest-dialog');
    if (!dialog) return;
    dialog.setAttribute('aria-labelledby', 'dialog-title');
    dialog.innerHTML = `<form class="dialog-card" data-detail-form>
      <button type="button" class="dialog-close" data-action="close-dialog" aria-label="閉じる">×</button>
      <div class="dialog-hero"><span aria-hidden="true">${item.emoji}</span><div><p>${item.category}・${item.phase}</p><h2 id="dialog-title">${escapeHtml(item.title)}</h2></div></div>
      <div class="dialog-body"><span class="safety ${safetyClass(item.safety)}">${escapeHtml(item.safety)}</span><section class="hint-section"><h3>🧭 やってみよう</h3><p>${escapeHtml(item.hint)}</p></section><section class="unlock-section"><h3>✨ できるようになること</h3><p>${escapeHtml(item.unlocks)}</p></section>${item.preparation.length ? `<section class="prepare-section"><h3>🛡️ 準備と注意</h3><ul>${item.preparation.map((tip) => `<li>${escapeHtml(tip)}</li>`).join('')}</ul></section>` : ''}
        <h3>だれと達成した？</h3><div class="player-select">${PLAYERS.map((player) => `<label style="--player:${player.color}"><input type="checkbox" name="players" value="${player.id}" ${(record?.players?.includes(player.id) || (!record && true)) ? 'checked' : ''}><span>${player.icon}<b>${player.name}</b></span></label>`).join('')}</div>
        <label class="note-field"><b>思い出メモ</b><textarea name="note" maxlength="500" placeholder="どんなことがあった？">${escapeHtml(record?.note || '')}</textarea></label>
      </div><div class="dialog-actions">${done ? `<button type="button" class="danger-link" data-action="uncomplete-detail">未達成に戻す</button>` : '<span></span>'}<button type="submit" class="primary-button">${done ? '記録を保存' : 'できた！にする'}</button></div>
    </form>`;
    if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open', '');
    $('.dialog-close', dialog)?.focus({ preventScroll: true });
  }

  function closeDialog(restoreFocus = true) {
    const dialog = $('#quest-dialog');
    if (!dialog) return;
    if (typeof dialog.close === 'function' && dialog.open) dialog.close(); else dialog.removeAttribute('open');
    const opener = ui.dialogOpener;
    ui.detailId = null;
    ui.dialogOpener = null;
    if (restoreFocus && opener?.isConnected) opener.focus({ preventScroll: true });
  }

  function saveDetail(form) {
    const id = ui.detailId;
    if (!id) return;
    const players = $$('input[name="players"]:checked', form).map((input) => input.value);
    const note = $('textarea[name="note"]', form)?.value || '';
    const existing = state.progress[id];
    const timestamp = existing?.completedAt || new Date().toISOString();
    setState(completeActivity(state, id, players.length ? players : PLAYERS.map((player) => player.id), note, timestamp));
    closeDialog(false);
    playTone('complete');
    toast('思い出を保存しました');
    updateActivityUI(id, 'hint');
    celebrate(id);
  }

  function showRecoveryDialog() {
    if (pendingRecoveryRaw === null) return;
    const dialog = $('#recovery-dialog');
    if (!dialog) return;
    dialog.innerHTML = `<div class="dialog-card recovery-card"><div class="dialog-hero"><span aria-hidden="true">🧰</span><div><p>SAVE DATA RECOVERY</p><h2 id="recovery-title">記録を守るために確認してね</h2></div></div><div class="dialog-body"><p>このブラウザの保存データを正しく読めませんでした。勝手に上書きせず、どうするか選べます。</p><div class="recovery-options"><button type="button" class="secondary-button" data-action="download-corrupt">⇩ 壊れたデータを保存</button><button type="button" class="primary-button" data-action="import-corrupt-backup">⇧ バックアップから復元</button><button type="button" class="danger-button" data-action="discard-corrupt">新しい記録で始める</button></div><small>迷ったら、まず「壊れたデータを保存」を押してから、バックアップを復元してください。</small></div></div>`;
    if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open', '');
    $('[data-action="download-corrupt"]', dialog)?.focus({ preventScroll: true });
  }

  function closeRecoveryDialog() {
    const dialog = $('#recovery-dialog');
    if (!dialog) return;
    if (typeof dialog.close === 'function' && dialog.open) dialog.close(); else dialog.removeAttribute('open');
  }

  function downloadCorruptData() {
    if (pendingRecoveryRaw === null) return;
    try {
      const blob = new Blob([pendingRecoveryRaw], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `ほのそうパパワールド_読めなかった保存データ_${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('読めなかったデータを保存しました');
    } catch (_error) {
      toast('データを保存できませんでした');
    }
  }

  function exportData() {
    try {
      const blob = new Blob([createBackup(state)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `ほのそうパパワールド_バックアップ_DAY${state.currentDay}.json`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('バックアップを保存しました');
    } catch (_error) {
      toast('バックアップを保存できませんでした');
    }
  }

  function importData(file, recoveryMode = false) {
    if (!file || file.size > 2_000_000) {
      toast('2MB以下のバックアップを選んでください');
      return;
    }
    const reader = new FileReader();
    reader.addEventListener('load', () => {
      const parsed = parseBackup(String(reader.result));
      if (!parsed.ok) {
        toast('このファイルは復元できません');
        return;
      }
      const snapshot = recoveryMode ? pendingRecoveryRaw : createBackup(state);
      if (snapshot === null || !saveRecoverySnapshot(snapshot)) {
        storageHealthy = false;
        storageIssue = 'recovery-failed';
        renderStorageAlert();
        toast('現在の記録を保護できないため、復元を中止しました');
        return;
      }
      if (recoveryMode) pendingRecoveryRaw = null;
      setState({ ...parsed.state, started: true });
      if (recoveryMode) closeRecoveryDialog();
      toast('バックアップを復元しました');
      if (recoveryMode) showApp(); else renderView();
    });
    reader.addEventListener('error', () => toast('ファイルを読めませんでした'));
    reader.readAsText(file);
  }

  function onClick(event) {
    if (event.target.matches?.('#quest-dialog')) {
      closeDialog();
      return;
    }
    const button = event.target.closest('button');
    if (!button) return;
    if (button.id === 'start-button') {
      if (pendingRecoveryRaw !== null) {
        showRecoveryDialog();
        return;
      }
      setState({ ...state, started: true, world: { ...state.world, startedAt: state.world?.startedAt || new Date().toISOString() } });
      playTone('start');
      showApp();
      return;
    }
    if (button.dataset.view) {
      ui.view = button.dataset.view;
      ui.resetArmed = false;
      renderView();
      globalThis.scrollTo?.({ top: 0, behavior: state.settings.reducedMotion ? 'auto' : 'smooth' });
      return;
    }
    if (button.dataset.jumpCategory) {
      ui.category = button.dataset.jumpCategory;
      ui.status = 'all';
      ui.query = '';
      ui.view = 'board';
      renderView();
      return;
    }
    if (button.dataset.filterCategory) {
      ui.category = button.dataset.filterCategory;
      renderView();
      return;
    }
    if (button.dataset.filterStatus) {
      ui.status = button.dataset.filterStatus;
      renderView();
      return;
    }
    const action = button.dataset.action;
    if (action === 'complete') quickComplete(button.dataset.id);
    if (action === 'hint') openDetail(button.dataset.id, button);
    if (action === 'close-dialog') closeDialog();
    if (action === 'goal') {
      const result = toggleGoal(state, button.dataset.id);
      if (!result.ok && result.reason === 'limit') toast('今日の目標は5個までです');
      else { setState(result.state); playTone('tap'); updateActivityUI(button.dataset.id, 'goal'); }
    }
    if (action === 'favorite') {
      setState(toggleFavorite(state, button.dataset.id));
      playTone('tap');
      updateActivityUI(button.dataset.id, 'favorite');
    }
    if (action === 'day-minus' || action === 'day-plus') {
      const before = state.currentDay;
      setState(changeDay(state, action === 'day-plus' ? 1 : -1));
      if (before === state.currentDay) toast(state.currentDay === 1 ? '1日目がスタートです' : '100日目がゴールです');
      else playTone('tap');
      updateDayUI();
    }
    if (action === 'clear-filter') {
      Object.assign(ui, { query: '', category: 'all', status: 'all' });
      renderView();
    }
    if (action === 'uncomplete-detail') {
      const id = ui.detailId;
      setState(uncompleteActivity(state, id));
      closeDialog(false);
      toast('「これから」に戻しました');
      updateActivityUI(id, 'hint');
    }
    if (action === 'download-corrupt') downloadCorruptData();
    if (action === 'import-corrupt-backup') $('#recovery-import-file')?.click();
    if (action === 'discard-corrupt') {
      if (pendingRecoveryRaw === null || !saveRecoverySnapshot(pendingRecoveryRaw)) {
        toast('元のデータを保護できないため、まだ新しく始められません');
        return;
      }
      pendingRecoveryRaw = null;
      state = createDefaultState();
      persist();
      closeRecoveryDialog();
      showStart();
      toast('新しい記録を始められます');
    }
    if (action === 'export') exportData();
    if (action === 'retry-save') {
      toast(persist() ? '記録を保存しました' : 'まだ保存できません。バックアップも利用してください');
    }
    if (action === 'import') $('#import-file')?.click();
    if (action === 'reset') {
      if (!ui.resetArmed) {
        ui.resetArmed = true;
        renderView();
        toast('もう一度押すと、すべて初期化します');
        setTimeout(() => { ui.resetArmed = false; }, 6000);
      } else {
        state = createDefaultState();
        persist();
        ui.resetArmed = false;
        showStart();
        toast('データを初期化しました');
      }
    }
  }

  function onInput(event) {
    if (event.target.id === 'quest-search') {
      ui.query = event.target.value;
      const selectionStart = event.target.selectionStart;
      renderView();
      const input = $('#quest-search');
      input?.focus();
      input?.setSelectionRange(selectionStart, selectionStart);
    }
  }

  function onChange(event) {
    const setting = event.target.dataset.setting;
    if (setting) {
      setState({ ...state, settings: { ...state.settings, [setting]: event.target.checked } });
      if (setting === 'sound' && event.target.checked) playTone('tap');
      renderView();
    }
    if (event.target.id === 'import-file') importData(event.target.files?.[0]);
    if (event.target.id === 'recovery-import-file') importData(event.target.files?.[0], true);
  }

  function init() {
    document.title = config.appTitle;
    applySettings();
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    $('#recovery-dialog')?.addEventListener('cancel', (event) => event.preventDefault());
    document.addEventListener('submit', (event) => {
      if (event.target.matches('[data-detail-form]')) {
        event.preventDefault();
        saveDetail(event.target);
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeDialog();
      if (event.key === '/' && ui.view === 'board' && !event.target.matches('input, textarea')) {
        event.preventDefault();
        $('#quest-search')?.focus();
      }
    });
    globalThis.addEventListener?.('storage', (event) => {
      if (event.key === STORAGE_KEY && event.newValue) {
        try {
          const incoming = JSON.parse(event.newValue);
          if (!validateState(incoming)) return;
          if (isIncomingNewer(state, incoming)) {
            state = normalizeState(incoming);
            renderView();
            toast('別のタブの新しい変更を反映しました');
          } else if (incoming.updatedAt !== state.updatedAt) {
            const repaired = persist();
            toast(repaired ? '別のタブには古い記録がありました。この画面の新しい記録を守りました' : '新しい記録を守りましたが、保存し直せませんでした');
          }
        } catch (_error) { /* ignore malformed external writes */ }
      }
    });
    showStart();
    if (pendingRecoveryRaw !== null) showRecoveryDialog();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
  else init();
}());
  </script>
</body>
</html>
